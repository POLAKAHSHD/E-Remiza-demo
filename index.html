<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Remiza DEMO</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
}

header {
    background: #b40000;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-bottom: 0;
}

main {
    max-width: 700px;
    margin: 20px auto;
    padding: 10px;
}

.panel {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #bbb;
}

h2 {
    margin-top: 0;
}

input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 7px 0 15px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 17px;
    background: #c40000;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:active {
    background: #8f0000;
}

.alarm {
    display: none;
    background: #ffe0e0;
    border-left: 7px solid #d00000;
    padding: 18px;
    margin-top: 20px;
    border-radius: 8px;
}

.demo {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🚒 E-REMIZA</h1>
    <p>System alarmowania — DEMO</p>
</header>

<main>

<div class="panel">
    <h2>🚨 Utwórz alarm DEMO</h2>

    <label>Rodzaj zdarzenia:</label>
    <select id="type">
        <option>Pożar budynku</option>
        <option>Wypadek drogowy</option>
        <option>Miejscowe zagrożenie</option>
        <option>Alarm ćwiczebny</option>
    </select>

    <label>Miejsce:</label>
    <input id="place" placeholder="np. ul. Przykładowa 12">

    <label>Jednostka:</label>
    <select id="unit">
        <option>OSP Jednostka Demo 1</option>
        <option>OSP Jednostka Demo 2</option>
        <option>OSP Jednostka Testowa</option>
    </select>

    <button onclick="sendAlarm()">🚨 DYSPONUJ — DEMO</button>

    <div id="alarm" class="alarm"></div>
</div>

<div class="panel">
    <h2>📋 Historia alarmów</h2>
    <div id="history">Brak alarmów.</div>
</div>

<p class="demo">
    ⚠️ SYSTEM DEMONSTRACYJNY — NIE JEST PRAWDZIWYM SYSTEMEM ALARMOWANIA
</p>

</main>

<script>
function sendAlarm() {

    let type = document.getElementById("type").value;
    let place = document.getElementById("place").value;
    let unit = document.getElementById("unit").value;

    if (place === "") {
        place = "Miejsce testowe";
    }

    let time = new Date().toLocaleTimeString();

    document.getElementById("alarm").style.display = "block";

    document.getElementById("alarm").innerHTML = `
        <h2>🚨 NOWY ALARM — DEMO</h2>
        <p><b>Rodzaj:</b> ${type}</p>
        <p><b>📍 Miejsce:</b> ${place}</p>
        <p><b>🚒 Jednostka:</b> ${unit}</p>
        <p><b>🕐 Godzina:</b> ${time}</p>
    `;

    document.getElementById("history").innerHTML =
        🚨 ${time} — ${type} — ${place}<br> +
        document.getElementById("history").innerHTML;
}
</script>

</body>
</html>
